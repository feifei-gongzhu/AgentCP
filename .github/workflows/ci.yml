name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  agentcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "pytest>=8"
      - name: Compile Python
        run: python -m compileall -q src
      - name: Run AgentCP tests
        run: python -m pytest -q

  agent-compose-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/agent-compose/runtime/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: third_party/agent-compose/runtime/javascript/package-lock.json
      - name: Install runtime dependencies
        run: npm ci
      - name: Typecheck runtime
        run: npm run typecheck
      - name: Test runtime
        run: npm test -- --run
      - name: Build runtime
        run: npm run build
      - name: Check frontend JavaScript
        working-directory: ${{ github.workspace }}
        run: node --check frontend/app.js
